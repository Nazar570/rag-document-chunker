<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Document Chunker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
    <div class="container">
        <h1 class="mb-4 text-center">RAG Document Chunker & Preprocessor</h1>
        <div class="card p-4 shadow-sm mb-4">
            <div class="mb-3">
                <label for="textInput" class="form-label">Input text:</label>
                <textarea id="textInput" class="form-control" rows="5" placeholder="Paste text to process..."></textarea>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="chunkSize" class="form-label">Chunk Size:</label>
                    <input type="number" id="chunkSize" class="form-control" value="5" min="1">
                </div>
                <div class="col-md-4">
                    <label for="overlap" class="form-label">Overlap:</label>
                    <input type="number" id="overlap" class="form-control" value="1" min="0">
                </div>
                <div class="col-md-4">
                    <label for="strategy" class="form-label">Strategy:</label>
                    <select id="strategy" class="form-select">
                        <option value="word">By words</option>
                        <option value="character">By characters</option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button id="processBtn" class="btn btn-primary w-100" onclick="processText()">Split into chunks</button>
            </div>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="resultsCard" class="card p-4 shadow-sm d-none">
            <h4 class="mb-3">Generated chunks:</h4>
            <div id="chunksList" class="d-flex flex-column gap-3"></div>
        </div>
    </div>

    <script>
        async function processText() {
            const text = document.getElementById("textInput").value;
            const chunkSize = parseInt(document.getElementById("chunkSize").value, 10);
            const overlap = parseInt(document.getElementById("overlap").value, 10);
            const strategy = document.getElementById("strategy").value;

            const errorAlert = document.getElementById("errorAlert");
            const resultsCard = document.getElementById("resultsCard");
            const chunksList = document.getElementById("chunksList");

            errorAlert.classList.add("d-none");
            resultsCard.classList.add("d-none");
            chunksList.innerHTML = "";

            try {
                const response = await fetch("/api/documents/process", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        chunk_size: chunkSize,
                        overlap: overlap,
                        strategy: strategy
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "An error occurred during processing");
                }

                resultsCard.classList.remove("d-none");

                data.chunks.forEach(chunk => {
                    const chunkEl = document.createElement("div");
                    chunkEl.className = "card border-secondary";
                    chunkEl.innerHTML = `
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="badge bg-secondary">Chunk #${chunk.chunk_index}</span>
                                <span class="badge bg-info text-dark">Units: ${chunk.token_count}</span>
                            </div>
                            <p class="card-text font-monospace bg-white p-2 rounded border mb-0">${chunk.text}</p>
                        </div>
                    `;
                    chunksList.appendChild(chunkEl);
                });
            } catch (err) {
                errorAlert.textContent = err.message;
                errorAlert.classList.remove("d-none");
            }
        }
    </script>
</body>
</html>
